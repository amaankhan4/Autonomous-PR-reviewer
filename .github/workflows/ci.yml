name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # conftest.py pins the suite to SQLite, an in-memory vector store and
        # blank Redis/Upstash credentials, so no services are needed here.
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: pr-reviewer-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: pr-reviewer-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  e2e:
    name: End-to-end smoke (compose stack)
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the API to become ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/ready > /dev/null; then
              echo "API ready after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "API never became ready"; docker compose logs --no-color api; exit 1

      - name: Run the end-to-end smoke test
        run: |
          pip install httpx
          python scripts/e2e_smoke.py --base-url http://localhost:8000

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
