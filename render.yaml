services:
  - type: web
    name: autonomous-pr-reviewer-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autonomous-pr-reviewer-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: MOCK_GITHUB
        value: "true"
      - key: LLM_PROVIDER
        value: mock
      - key: VECTOR_STORE
        value: memory
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: PUBLISH_REVIEWS
        value: "false"
      # Set this after the Vercel deployment is created.
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: autonomous-pr-reviewer-db
    plan: free
    region: singapore
